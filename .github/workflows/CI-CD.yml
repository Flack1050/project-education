name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notesdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: backend
        run: python -m py_compile app.py

      - name: Start backend
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: notesdb
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          venv/bin/python app.py &
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -fs http://localhost:5000/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Test API
        run: |
          curl --fail -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"CI test note"}' \
            http://localhost:5000/notes

          response=$(curl --fail http://localhost:5000/notes)
          echo "API response: $response"
          echo "$response" | grep -q "CI test note"

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_owner_lower: ${{ steps.meta.outputs.image_owner_lower }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_owner_lower }}/notes-backend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_owner_lower }}/notes-frontend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      IMAGE_OWNER: ${{ needs.build.outputs.image_owner_lower }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        run: |
          if [[ -z "$IMAGE_TAG" || ! "$IMAGE_TAG" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error::Invalid IMAGE_TAG: '$IMAGE_TAG'"
            exit 1
          fi

          echo "Deploying tag: $IMAGE_TAG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with rollback
        shell: bash
        run: |
          set -Eeuo pipefail

          STATE_DIR="${GITHUB_WORKSPACE}/.deploy-state"
          STATE_FILE="$STATE_DIR/current_tag"

          mkdir -p "$STATE_DIR"

          OLD_TAG=""

          if [[ -f "$STATE_FILE" ]]; then
            OLD_TAG=$(cat "$STATE_FILE")
            echo "Previous version: $OLD_TAG"
          else
            echo "No previous deployment found"
          fi


          create_env() {
            cat > "${GITHUB_WORKSPACE}/.env" <<ENVFILE
DB_HOST=db
DB_NAME=notesdb
DB_USER=postgres
DB_PASSWORD=${DB_PASSWORD}
IMAGE_TAG=${1}
IMAGE_OWNER=${IMAGE_OWNER}
ENVFILE

            chmod 600 "${GITHUB_WORKSPACE}/.env"
          }


          echo "Creating environment..."
          create_env "$IMAGE_TAG"


          echo "Pulling images..."
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose -f docker-compose.yml pull backend frontend


          echo "Starting deployment..."

          if IMAGE_TAG="$IMAGE_TAG" \
             docker compose -f docker-compose.yml up -d --wait --wait-timeout 90

          then

            echo "Deployment successful"

            echo "$IMAGE_TAG" > "$STATE_FILE"

            docker compose ps

            docker image prune -af --filter "until=168h" || true


          else

            echo "::error::Deployment failed"

            if [[ -n "$OLD_TAG" ]]; then

              echo "Rollback to $OLD_TAG"

              create_env "$OLD_TAG"

              IMAGE_TAG="$OLD_TAG" \
              docker compose -f docker-compose.yml up -d --wait --wait-timeout 90

              echo "$OLD_TAG" > "$STATE_FILE"

              echo "Rollback completed"

            else

              echo "::error::No rollback version available"

            fi

            exit 1

          fi


      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "${GITHUB_WORKSPACE}/.env"
