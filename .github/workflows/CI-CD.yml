name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notesdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: backend
        run: |
          python -m compileall .

      - name: Start backend
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: notesdb
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          venv/bin/python app.py &
          sleep 5

      - name: Test API
        run: |
          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"CI test note"}' \
            http://localhost:5000/notes

          response=$(curl --fail http://localhost:5000/notes)

          echo "API response:"
          echo "$response"

          echo "$response" | grep -q "CI test note"

      - name: Build backend Docker image
        run: |
          docker build -t notes-backend:test ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t notes-frontend:test ./frontend 

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ghcr.io/$IMAGE_OWNER/notes-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            -t ghcr.io/$IMAGE_OWNER/notes-frontend:latest \
            ./frontend

      - name: Push backend image
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$IMAGE_OWNER/notes-backend:latest

      - name: Push frontend image
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$IMAGE_OWNER/notes-frontend:latest        

  deploy:
    name: Deploy
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker compose pull

      - name: Deploy
        run: |
          docker compose up -d

      - name: Check containers
        run: |
          docker compose ps
