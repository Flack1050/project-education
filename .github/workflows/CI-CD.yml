name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notesdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: backend
        run: |
          python -m compileall .

      - name: Start backend
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: notesdb
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          venv/bin/python app.py &
          sleep 5

      - name: Test API
        run: |
          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"CI test note"}' \
            http://localhost:5000/notes

          response=$(curl --fail http://localhost:5000/notes)

          echo "API response:"
          echo "$response"

          echo "$response" | grep -q "CI test note"

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/$IMAGE_OWNER/notes-backend:${{ steps.meta.outputs.image_tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/$IMAGE_OWNER/notes-frontend:${{ steps.meta.outputs.image_tag }} \
            ./frontend

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/$IMAGE_OWNER/notes-backend:${{ steps.meta.outputs.image_tag }}

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/$IMAGE_OWNER/notes-frontend:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create environment file
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > .env <<EOF
          DB_PASSWORD=$DB_PASSWORD
          EOF

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -Eeuo pipefail

          STATE_DIR="$HOME/project-deploy"
          STATE_FILE="$STATE_DIR/current_tag"

          mkdir -p "$STATE_DIR"

          NEW_TAG="$IMAGE_TAG"

          echo "New version: $NEW_TAG"

          if [ -f "$STATE_FILE" ]; then
            OLD_TAG=$(cat "$STATE_FILE")
            echo "Current version: $OLD_TAG"
          else
            OLD_TAG=""
            echo "No previous version found."
          fi

          export IMAGE_TAG="$NEW_TAG"

          echo "Pulling new images..."
          docker compose pull

          echo "Starting new version..."

          if docker compose up -d --wait --wait-timeout 60; then
            echo "Deployment successful."

            echo "$NEW_TAG" > "$STATE_FILE"

            echo "Running containers:"
            docker compose ps

          else
            echo "Deployment failed!"

            if [ -n "$OLD_TAG" ]; then
              echo "Rolling back to $OLD_TAG..."

              export IMAGE_TAG="$OLD_TAG"

              docker compose pull
              docker compose up -d --wait --wait-timeout 60

              echo "Rollback completed."

              echo "$OLD_TAG" > "$STATE_FILE"

              docker compose ps

            else
              echo "No previous version available for rollback."
              exit 1
            fi

            exit 1
          fi
