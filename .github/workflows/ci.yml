name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notesdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: backend
        run: |
          python -m compileall .

      - name: Start backend
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: notesdb
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          venv/bin/python app.py &
          sleep 5

      - name: Test API
        run: |
          curl --fail http://localhost:5000/notes
