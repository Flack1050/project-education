services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      grafana:
        condition: service_started

    networks:
      - frontend
      - backend

    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      service_name: "nginx"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    image: ghcr.io/${IMAGE_OWNER:-flack1050}/notes-frontend:${IMAGE_TAG:-latest}
    build: ./frontend

    restart: unless-stopped

    networks:
      - frontend

    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      service_name: "frontend"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  backend:
    image: ghcr.io/${IMAGE_OWNER:-flack1050}/notes-backend:${IMAGE_TAG:-latest}
    build: ./backend

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    labels:
      service_name: "backend"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notesdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      service_name: "postgres"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

    networks:
      - monitoring

    labels:
      service_name: "node-exporter"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    networks:
      - monitoring
      - backend

    depends_on:
      backend:
        condition: service_healthy
      node-exporter:
        condition: service_started

    labels:
      service_name: "prometheus"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password

      GF_SERVER_ROOT_URL: http://localhost:8081/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    secrets:
      - grafana_admin_password

    networks:
      - monitoring
      - frontend

    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

    labels:
      service_name: "grafana"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped

    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

    command: -config.file=/etc/loki/config.yml

    networks:
      - monitoring

    labels:
      service_name: "loki"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  alloy:
    image: grafana/alloy:v1.4.0
    restart: unless-stopped

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data

    networks:
      - monitoring

    depends_on:
      loki:
        condition: service_started

    labels:
      service_name: "alloy"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  monitoring:
    driver: bridge
    internal: true


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:


secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
