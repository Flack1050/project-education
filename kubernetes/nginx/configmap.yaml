
apiVersion: v1
kind: ConfigMap

metadata:
  namespace: education
  name: app-nginx-config

data:
  nginx.conf: |
    events {}

    http {

        server {
            listen 80;

            location = /nginx-health {
                access_log off;
                return 200 "ok\n";
            }

            location / {
                proxy_pass http://frontend:8080;
            }

            location /api/ {
                proxy_pass http://backend:5000/;
            }
        }
    }
