
apiVersion: v1
kind: ConfigMap

metadata:
  name: app-nginx-config

data:
  nginx.conf: |
    events {}

    http {
        resolver 10.96.0.10 valid=10s ipv6=off;

        server {
            listen 80;

            location / {
                proxy_pass http://frontend.default.svc.cluster.local:8080;
            }

            location /api/ {
                rewrite ^/api/(.*)$ /$1 break;

                proxy_pass http://backend.default.svc.cluster.local:5000;
            }
        }
    }
