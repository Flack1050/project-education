
apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-nginx

  template:
    metadata:
      labels:
        app: app-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config
          configMap:
            name: app-nginx-config
