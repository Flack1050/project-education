
apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: education
  name: app-nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-nginx

  template:
    metadata:
      labels:
        app: app-nginx

    spec:
      containers:
        - name: nginx
          image: notes-frontend:local
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config
          configMap:
            name: app-nginx-config
