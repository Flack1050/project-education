global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'notes-app'

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']
